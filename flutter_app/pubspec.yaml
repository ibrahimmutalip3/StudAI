name: study_assistant
description: "StudAI — a context-aware AI study companion for schoolchildren."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local database (Drift / SQLite) — see ADR in lib/core/database/tables.dart
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking (Gemini API calls, made directly from the device)
  http: ^1.2.2

  # Camera / images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # PDF support
  printing: ^5.13.4
  pdf: ^3.11.1
  # Pinned to an EXACT version (no ^) rather than a range: 32.2.9 (the
  # latest patch satisfying ^32.2.4 as of this CI run) fails `flutter
  # analyze` with "Undefined name 'SyncfusionLicense'" at the
  # SyncfusionLicense.registerLicense(...) call in lib/main.dart, even
  # though core.dart's public docs still list that API. 32.2.4 is the
  # version this was last verified working against — bump deliberately,
  # not automatically, and re-verify the license call still resolves.
  #
  # NOTE: pinning syncfusion_flutter_pdfviewer alone isn't enough — its
  # platform-interface and platform-implementation siblings
  # (syncfusion_pdfviewer_platform_interface, _web, _windows, _macos,
  # _linux) are separate pub packages with their own independent version
  # numbers, and without an explicit pin here pub resolved them to 32.2.9
  # regardless, reintroducing the same mismatch. All federated siblings
  # are pinned together below via dependency_overrides so the whole family
  # stays on one consistent version.
  syncfusion_flutter_pdfviewer: 32.2.4
  syncfusion_flutter_core: 32.2.4

  # File handling
  file_picker: ^8.1.6
  share_plus: ^10.1.2

  # Local notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Icons & UI
  cupertino_icons: ^1.0.8
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Connectivity
  connectivity_plus: ^6.1.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_markdown: ^0.7.4+3
  markdown: ^7.2.2

  # Localization
  flutter_localizations:
    sdk: flutter

  # Speech (voice mode architecture — text-to-speech works with zero backend;
  # speech-to-text requires platform mic permission, wired but gracefully
  # degrades if unavailable on a given device/platform).
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Animations
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Codegen
  # NOTE on version pins: riverpod_generator 2.x (matching flutter_riverpod
  # 2.x, used throughout this app — moving to 3.x/4.x is a breaking API
  # change across all 43 files that use Riverpod, so it's out of scope here)
  # constrains two transitive deps that keep colliding with newer siblings:
  #   - it needs package:build ^2.0.0, but build_runner >=2.15.3 needs
  #     package:build ^4.0.9 -> build_runner pinned to the 2.4.x line,
  #     which still resolves to build ^2.4.x.
  #   - it needs package:source_gen ^2.0.0, but drift_dev >=2.28.1 needs
  #     package:source_gen ^3.0.0 -> drift_dev pinned to ^2.28.0, the last
  #     line still on source_gen 2.x.
  # Revisit both pins together with a full Riverpod 3 migration.
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  riverpod_generator: ^2.6.5

  # App icon generation from a single source image (see assets/icons/app_icon_source.png).
  flutter_launcher_icons: ^0.14.3

# --- CI build compatibility pins -------------------------------------------
# SYSTEMIC ISSUE, not a one-off: many first-party Flutter plugins are mid
# -migration from Groovy (android/build.gradle) to Kotlin DSL
# (android/build.gradle.kts), and their new .kts files read
# `compileSdk = flutter.compileSdkVersion`. That `flutter` extension is only
# ever added to the *app* module by the real Flutter Gradle plugin. Our
# settings.gradle.kts uses the modern `dev.flutter.flutter-plugin-loader`
# (not the legacy apply-from setup), so library subprojects never get a real
# one. The workaround below in this file's `subprojects {}` block injects a
# look-alike `flutter` extension at *evaluation* time, which Groovy resolves
# dynamically and happily — but Kotlin DSL scripts are compiled *before* any
# of that runs, so `flutter.compileSdkVersion` is a compile-time
# "Unresolved reference" for any plugin that has made the Kotlin DSL switch.
# There is currently no general fix that doesn't involve either (a) pinning
# each affected plugin to its last Groovy release below, or (b) migrating
# this whole project to Flutter's built-in-Kotlin Gradle setup (a larger,
# separate change — see https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin).
# When a *new* plugin hits this (error message: "Unresolved reference:
# compileSdkVersion" pointing at some other package's build.gradle.kts),
# check that package's pub.dev changelog for a "Groovy to Kotlin" entry and
# add an override here pinned to the release just before it.
dependency_overrides:
  # 2.0.33 is the last release still on the working Groovy build script;
  # 2.0.34 switched to build.gradle.kts.
  # Tracking: https://github.com/flutter/flutter/issues/184133
  flutter_plugin_android_lifecycle: 2.0.33

  # image_picker_android switched to build.gradle.kts at some point after
  # 0.8.13+17 (the version that was failing) — 0.8.13+14 is a known-good
  # Groovy release used successfully elsewhere in the community for this
  # exact issue.
  image_picker_android: 0.8.13+14

  # path_provider_android 2.2.23 switched to build.gradle.kts (see its
  # pub.dev changelog: "Updates build files from Groovy to Kotlin").
  # 2.2.22 is the last Groovy release.
  path_provider_android: 2.2.22

  # device_info_plus 12.4.0+ added an `isiOSAppOnVision` property backed by
  # an NSProcessInfo selector that only exists in the iOS 26.1 SDK. Our iOS
  # workflow builds on macos-14 / Xcode 15.4 (pinned there because newer
  # Xcode images dropped alongside Flutter versions this app can't yet
  # move to — see the Flutter version note in .github/workflows/ios.yml),
  # whose SDK doesn't declare that selector, so Xcode fails with
  # "No visible @interface for 'NSProcessInfo' declares the selector
  # 'isiOSAppOnVision'". 12.3.0 is the last release before that property
  # was added. A runtime-guarded fix has been proposed upstream but is not
  # in a published release yet.
  # Tracking: https://github.com/fluttercommunity/plus_plugins/pull/3812
  device_info_plus: 12.3.0

  # Federated-plugin siblings of syncfusion_flutter_pdfviewer (see the
  # comment by that dependency above) — pinned to the same 32.2.4 so pub
  # can't resolve them independently to a newer, mismatched patch.
  syncfusion_pdfviewer_platform_interface: 32.2.4
  syncfusion_pdfviewer_web: 32.2.4
  syncfusion_pdfviewer_windows: 32.2.4
  syncfusion_pdfviewer_macos: 32.2.4
  syncfusion_pdfviewer_linux: 32.2.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/

# StudAI app icon: the source image IS the icon, unmodified except for
# resizing per density bucket. Deliberately NOT using adaptive_icon_*
# (which would split the image into separate foreground/background
# layers) — every mipmap-<density>/ic_launcher.png is the same flat
# artwork, just scaled, exactly as provided.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon_source.png"
  min_sdk_android: 21
  remove_alpha_ios: true
