name: Android Release Build

# Builds a release APK of the Flutter app and uploads it as a workflow
# artifact. The Gemini API key is read from the GEMINI_API_KEY repository
# secret and injected at build time only via --dart-define — it is never
# written to disk, never committed, and never printed to the build log.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the last Flutter release before Dart 3.10's
          # "dot shorthands" language feature (shipped in Flutter 3.38+).
          # riverpod_generator 2.x / drift_dev 2.x are pinned to
          # analyzer <7.0.0 (see the note in pubspec.yaml) and that
          # analyzer version cannot parse dot-shorthand syntax now baked
          # into the Flutter SDK itself. On Flutter >=3.38 this doesn't
          # error out — analyzer hits an unhandled exception deep inside
          # AnalysisDriverScheduler and the whole build_runner process
          # hangs forever instead of failing, which is why builds were
          # running for 6 hours until GitHub cancelled them. Bumping to
          # 3.38+ requires riverpod_generator 4.x, which requires a
          # Riverpod 2 -> 3 migration (a separate, larger change) — so for
          # now stay on the last 3.35.x patch release. The Android Gradle
          # Plugin / Gradle / Kotlin versions in android/ were bumped to
          # 8.13.0 / 8.13 / 2.1.20 to match (AGP 8.5.2 only supports
          # compileSdk up to API 34, but this project builds against
          # compileSdk 35).
          flutter-version: "3.35.5"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run code generation (Drift / Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional — leave the repo secret unset and the PDF viewer still
          # works, just with a small unlicensed-build watermark.
          SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dart-define=SYNCFUSION_LICENSE_KEY="$SYNCFUSION_LICENSE_KEY"

      - name: Locate build output
        id: locate
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found at $APK_PATH"
            exit 1
          fi
          echo "apk_path=flutter_app/$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: studai-android-release-apk
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
